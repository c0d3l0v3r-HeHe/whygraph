[project]
name = "whygraph"
version = "0.1.0"
description = "Answers 'why is the code like this?' with an evidence graph built from git history"
requires-python = ">=3.12,<3.13"
dependencies = [
  "neo4j>=5.26",
  "google-genai>=1.0",
  "fastembed>=0.4",
  "tree-sitter>=0.23",
  "tree-sitter-python>=0.23",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "rapidfuzz>=3.9",
]

[tool.uv]
package = false
